name: proof-portguardian-201553-v2

# Evidence for openclaw/openclaw PR #201553 - the two ClawSweeper blockers:
#   1. lifecycle: an unreadable Gateway port must attach, never spawn a child
#   2. upgrade: an old app's own Pause resume record must survive the candidate
#   3. regression: the production fix is what makes the new tests green
# Everything runs on hosted macos-26 (no Xcode on the local machine). Logs are
# printed inline in the GHA log; artifacts are a secondary convenience.
'on':
  workflow_dispatch:
    inputs:
      run:
        description: which evidence to produce (all runs every job)
        required: true
        default: all
        type: choice
        options:
          - all
          - lifecycle
          - lifecycle-no-listener
          - upgrade
          - regression
          - managed
          - migration
      mode:
        description: head or base (filters lifecycle/regression when run != all)
        required: true
        default: head
        type: choice
        options:
          - head
          - base

permissions:
  contents: read

env:
  FORK: SunnyShu0925/openclaw
  PR_HEAD: 8ba0147560166a6ef593892719f3ef09605db2a6
  PR_BRANCH: fix/macos-portguardian-inconclusive-190152
  BASE: c44c610d32627fc2a5d3de483a52d51c3d771e43
  PR_BASE: 999e873a916552e652239e47e9ad26dea4228517
  OLD_TAG: v2026.11.10
  GATEWAY_PORT: '18789'
  BUNDLE_ID: ai.openclaw.mac

jobs:
  # ================================================================ lifecycle
  lifecycle-head:
    name: lifecycle-head
    if: ${{ inputs.run == 'all' || (inputs.run == 'lifecycle' && inputs.mode == 'head') || inputs.run == 'lifecycle-no-listener' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout PR head (candidate)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: openclaw

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY
          git diff --stat

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package the app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 80
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw
          ls -la dist/OpenClaw.app/Contents/MacOS/ || true

      - name: Capture lifecycle (broken lsof + AX Restart Gateway)
        working-directory: openclaw
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/pg201553/lifecycle-head
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          SCENARIO="${{ inputs.run == 'lifecycle-no-listener' && 'no-listener' || 'with-listener' }}"
          bash "$PROBE_DIR/lifecycle-capture.sh" lifecycle-head head "$SCENARIO" 2>&1 \
            | tee "$OUT_DIR/capture.log"
          rc=${PIPESTATUS[0]}
          echo "CAPTURE_RC=$rc"
          exit "$rc"

      - name: Show inline raw lifecycle evidence
        if: always()
        run: |
          O=/tmp/pg201553/lifecycle-head
          echo "===== $O/verdict.log ====="; cat "$O/verdict.log" 2>/dev/null || true
          echo "===== stub calls.log ====="; cat "$O/poison/calls.log" 2>/dev/null || true
          echo "===== listener ps before ====="; cat "$O/listeners-before.ps" 2>/dev/null || true
          echo "===== listener ps after ====="; cat "$O/listeners-after.ps" 2>/dev/null || true
          echo "===== AX menu log ====="; cat "$O/menu.log" 2>/dev/null || true
          echo "===== unified-log matches ====="
          grep -iE 'using existing instance|using existing gateway|Failed: Could not|Could not inspect port|Could not determine whether port|retry in a moment|five failed starts|childSupervisor|child exited|gateway child launch|attach' \
            "$O/oslog.txt" 2>/dev/null | tail -30 || true
          echo "===== gateway child log (raw tail) ====="
          tail -40 "$O/logs/openclaw-gateway.log" 2>/dev/null || true

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-lifecycle-head
          path: /tmp/pg201553/lifecycle-head/

  lifecycle-base:
    name: lifecycle-base
    if: ${{ inputs.run == 'all' || (inputs.run == 'lifecycle' && inputs.mode == 'base') || inputs.run == 'lifecycle-no-listener' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout upstream base commit
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: c44c610d32627fc2a5d3de483a52d51c3d771e43
          path: openclaw

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          echo "BASE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== the conflating guard on this base ==="
          grep -n "guard res.ok" apps/macos/Sources/OpenClaw/PortGuardian.swift || true
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY
          git diff --stat

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package the app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 80
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw
          ls -la dist/OpenClaw.app/Contents/MacOS/ || true

      - name: Capture lifecycle (broken lsof + AX Restart Gateway)
        working-directory: openclaw
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/pg201553/lifecycle-base
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          SCENARIO="${{ inputs.run == 'lifecycle-no-listener' && 'no-listener' || 'with-listener' }}"
          bash "$PROBE_DIR/lifecycle-capture.sh" lifecycle-base base "$SCENARIO" 2>&1 \
            | tee "$OUT_DIR/capture.log"
          rc=${PIPESTATUS[0]}
          echo "CAPTURE_RC=$rc"
          exit "$rc"

      - name: Show inline raw lifecycle evidence
        if: always()
        run: |
          O=/tmp/pg201553/lifecycle-base
          echo "===== $O/verdict.log ====="; cat "$O/verdict.log" 2>/dev/null || true
          echo "===== stub calls.log ====="; cat "$O/poison/calls.log" 2>/dev/null || true
          echo "===== listener ps before ====="; cat "$O/listeners-before.ps" 2>/dev/null || true
          echo "===== listener ps after ====="; cat "$O/listeners-after.ps" 2>/dev/null || true
          echo "===== AX menu log ====="; cat "$O/menu.log" 2>/dev/null || true
          echo "===== unified-log matches ====="
          grep -iE 'using existing instance|using existing gateway|Failed: Could not|Could not inspect port|Could not determine whether port|retry in a moment|five failed starts|childSupervisor|child exited|gateway child launch|attach' \
            "$O/oslog.txt" 2>/dev/null | tail -30 || true
          echo "===== gateway child log (raw tail) ====="
          tail -40 "$O/logs/openclaw-gateway.log" 2>/dev/null || true

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-lifecycle-base
          path: /tmp/pg201553/lifecycle-base/

  # ================================================================== upgrade
  upgrade:
    name: upgrade-old-app-resume
    if: ${{ inputs.run == 'all' || inputs.run == 'upgrade' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout old stable app (v2026.11.10)
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: v2026.11.10
          path: old

      - name: Checkout PR head (candidate)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: new

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Package the old stable app
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd old
          corepack enable
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          node scripts/prepare-apple-mermaid.mjs || true
          pnpm plugins:assets:build || true
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw
          ls -la dist/OpenClaw.app/Contents/Resources/runtime/bin/ || true

      - name: Package the candidate app
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd new
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/prepare-apple-mermaid.mjs
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old_line = "                    VideoPlayer(player: player.player)"
          new_line = "                    Color.black"
          if old_line in src:
              open(path, "w").write(src.replace(old_line, new_line, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY
          pnpm plugins:assets:build
          mkdir -p "$HOME/.openclaw"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw
          ls -la dist/OpenClaw.app/Contents/Resources/runtime/bin/ || true

      - name: Run the real old-app -> candidate upgrade and resume
        env:
          OUT_DIR: /tmp/pg201553/upgrade
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          OLD_APP_PATH: ${{ github.workspace }}/old/dist/OpenClaw.app
          NEW_APP_PATH: ${{ github.workspace }}/new/dist/OpenClaw.app
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          bash "$PROBE_DIR/upgrade-app-resume.sh" 2>&1 | tee "$OUT_DIR/capture.log"
          rc=${PIPESTATUS[0]}
          echo "CAPTURE_RC=$rc"
          exit "$rc"

      - name: Show inline raw upgrade evidence
        if: always()
        run: |
          O=/tmp/pg201553/upgrade
          echo "===== $O/verdict.log ====="; cat "$O/verdict.log" 2>/dev/null || true
          echo "===== stub calls.log ====="; cat "$O/poison/calls.log" 2>/dev/null || true
          echo "===== intent compare ====="; cat "$O/intent-compare.txt" 2>/dev/null || true
          echo "===== storage SHAs / resume (redacted in verdict) ====="
          grep -E 'PLIST_SHA|PIN_DB_SHA|CONFIG_SHA|RESUME_|INTENT_|LISTENER_|OLD_SERVICE_|PROOF_FAIL|PASS:|FAIL:' \
            "$O/verdict.log" 2>/dev/null || true
          echo "===== candidate gateway status (safe lines) ====="
          grep -iE 'Port |Listening|running|service|resume' "$O/gateway-status-after.log" 2>/dev/null | head -12 || true
          echo "===== old CLI install (safe lines, redacted) ====="
          tail -15 "$O/install-old.log" 2>/dev/null \
            | sed -E 's/(token|apiKey|api_key|secret|password)[^,}]*/\1=<redacted>/Ig' || true
          echo "===== old pause log (safe lines, redacted) ====="
          grep -iE 'resume|retain|pause|stop|service' "$O/old-app-pause.log" 2>/dev/null \
            | sed -E 's/(token|apiKey|api_key|secret|password)[^,}]*/\1=<redacted>/Ig' | tail -20 || true
          echo "===== old resume log (safe lines, redacted) ====="
          grep -iE 'resume|retain|pause|service|install' "$O/old-app-resume.log" 2>/dev/null \
            | sed -E 's/(token|apiKey|api_key|secret|password)[^,}]*/\1=<redacted>/Ig' | tail -20 || true

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-upgrade
          path: /tmp/pg201553/upgrade/

  # ================================================================ regression
  regression-head:
    name: regression-head
    if: ${{ inputs.run == 'all' || (inputs.run == 'regression' && inputs.mode == 'head') }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout PR head (tests and production both at the PR)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: openclaw
          fetch-depth: 0

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Run the two Swift suites (expect green)
        working-directory: openclaw
        timeout-minutes: 120
        env:
          OUT_DIR: /tmp/pg201553/regression-head
        run: |
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          STATUS="$OUT_DIR/verdict.log"
          : > "$STATUS"
          say() { echo "$@" | tee -a "$STATUS"; }
          fail=0
          check() {
            local label="$1"; shift
            if "$@"; then say "PASS: $label"; else say "FAIL: $label"; fail=1; fi
          }
          say "==== regression head ===="
          say "HEAD_COMMIT=$(git rev-parse HEAD)"
          say "TEST_SOURCE=apps/macos/Tests/OpenClawIPCTests (from the PR head)"
          set +e
          swift test --package-path apps/macos --filter PortGuardianDiagnosticsTests \
            2>&1 | tee "$OUT_DIR/portguardian.log"
          RC1=${PIPESTATUS[0]}
          swift test --package-path apps/macos --filter GatewayProcessManagerTests \
            2>&1 | tee "$OUT_DIR/gatewaypm.log"
          RC2=${PIPESTATUS[0]}
          set -e
          say "PORTGUARDIAN_RC=$RC1"
          say "GATEWAYPM_RC=$RC2"
          say "--- first errors (raw) ---"
          grep -hE 'error:|failed|FAIL' "$OUT_DIR/portguardian.log" "$OUT_DIR/gatewaypm.log" 2>/dev/null | head -30 || true
          check "PortGuardianDiagnosticsTests is green on the PR head" test "$RC1" -eq 0
          check "GatewayProcessManagerTests is green on the PR head" test "$RC2" -eq 0
          say "PROOF_FAIL=$fail"
          exit "$fail"

      - name: Show inline raw regression evidence
        if: always()
        run: |
          O=/tmp/pg201553/regression-head
          echo "===== $O/verdict.log ====="; cat "$O/verdict.log" 2>/dev/null || true
          echo "===== PortGuardianDiagnosticsTests tail ====="; tail -40 "$O/portguardian.log" 2>/dev/null || true
          echo "===== GatewayProcessManagerTests tail ====="; tail -40 "$O/gatewaypm.log" 2>/dev/null || true

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-regression-head
          path: /tmp/pg201553/regression-head/

  regression-base:
    name: regression-base
    if: ${{ inputs.run == 'all' || (inputs.run == 'regression' && inputs.mode == 'base') }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout PR head (tests always come from the PR)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: openclaw
          fetch-depth: 0

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Restore PR production files to the PR merge base (base mode)
        working-directory: openclaw
        run: |
          set -euo pipefail
          # The PR was forked from 999e873; using current main would pull in
          # unrelated changes and produce a red that says nothing about this fix.
          PR_BASE=999e873a916552e652239e47e9ad26dea4228517
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "$PR_BASE"
          echo "PR_BASE_COMMIT=$(git rev-parse "$PR_BASE")" | tee -a "$GITHUB_STEP_SUMMARY"
          # Tests stay at the PR head; only production files go back to the PR base.
          git checkout "$PR_BASE" -- \
            apps/macos/Sources/OpenClaw/GatewayProcessManager+Hosting.swift \
            apps/macos/Sources/OpenClaw/GatewayProcessManager.swift \
            apps/macos/Sources/OpenClaw/ManagedNodeGatewayMigration.swift \
            apps/macos/Sources/OpenClaw/Onboarding.swift \
            apps/macos/Sources/OpenClaw/OnboardingView+Monitoring.swift \
            apps/macos/Sources/OpenClaw/PortGuardian.swift
          echo "--- reverted production files ---"
          git diff --name-only "$PR_BASE" -- apps/macos/Sources/OpenClaw/ | head -20 || true

      - name: Run the two Swift suites (expect red)
        working-directory: openclaw
        timeout-minutes: 120
        env:
          OUT_DIR: /tmp/pg201553/regression-base
        run: |
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          STATUS="$OUT_DIR/verdict.log"
          : > "$STATUS"
          say() { echo "$@" | tee -a "$STATUS"; }
          fail=0
          check() {
            local label="$1"; shift
            if "$@"; then say "PASS: $label"; else say "FAIL: $label"; fail=1; fi
          }
          say "==== regression base (production files reverted, tests at PR head) ===="
          say "HEAD_COMMIT=$(git rev-parse HEAD)"
          say "PR_BASE_COMMIT=$(git rev-parse 999e873a916552e652239e47e9ad26dea4228517)"
          set +e
          swift test --package-path apps/macos --filter PortGuardianDiagnosticsTests \
            2>&1 | tee "$OUT_DIR/portguardian.log"
          RC1=${PIPESTATUS[0]}
          swift test --package-path apps/macos --filter GatewayProcessManagerTests \
            2>&1 | tee "$OUT_DIR/gatewaypm.log"
          RC2=${PIPESTATUS[0]}
          set -e
          say "PORTGUARDIAN_RC=$RC1"
          say "GATEWAYPM_RC=$RC2"
          say "--- first compile/test errors (raw) ---"
          grep -hE 'error:|failed|FAIL' "$OUT_DIR/portguardian.log" "$OUT_DIR/gatewaypm.log" 2>/dev/null | head -30 || true
          RED=0
          [ "$RC1" -ne 0 ] && RED=1
          [ "$RC2" -ne 0 ] && RED=1
          check "reverting the production fix makes the suites red" test "$RED" -eq 1
          say "PROOF_FAIL=$fail"
          exit "$fail"

      - name: Show inline raw regression evidence
        if: always()
        run: |
          O=/tmp/pg201553/regression-base
          echo "===== $O/verdict.log ====="; cat "$O/verdict.log" 2>/dev/null || true
          echo "===== PortGuardianDiagnosticsTests tail ====="; tail -40 "$O/portguardian.log" 2>/dev/null || true
          echo "===== GatewayProcessManagerTests tail ====="; tail -40 "$O/gatewaypm.log" 2>/dev/null || true

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-regression-base
          path: /tmp/pg201553/regression-base/

  # ============================================== ordinary managed startup (blocker)
  # The two lifecycle fixtures set disable-launchagent and passed --attach-only,
  # so installation == .external and startAppHostedGateway returned at
  # GatewayProcessManager+Hosting.swift:341, before the inspection branch at :360.
  # This job removes both shortcuts and drives the packaged app's own startup:
  # broken lsof must produce no child, and an idle port must produce one, which is
  # the control that shows the fixture can start a healthy child at all.
  managed-start-head:
    name: managed-start-head
    if: ${{ inputs.run == 'all' || inputs.run == 'managed' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout PR head (candidate)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: openclaw

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY
          git diff --stat

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package the app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 80
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          # Packaging must not install behind the build's back; the capture removes
          # this marker again and asserts it is gone before the app is launched.
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw

      - name: Managed startup with an unreadable port
        working-directory: openclaw
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/pg201553/managed-broken
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          bash "$PROBE_DIR/managed-start-capture.sh" managed-broken broken 2>&1 | tee /tmp/pg201553/managed-broken.log
          rc=${PIPESTATUS[0]}
          echo "BROKEN_RC=$rc"
          exit "$rc"

      - name: Managed startup with an idle port (child must start)
        if: always()
        working-directory: openclaw
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/pg201553/managed-free
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          bash "$PROBE_DIR/managed-start-capture.sh" managed-free free 2>&1 | tee /tmp/pg201553/managed-free.log
          rc=${PIPESTATUS[0]}
          echo "FREE_RC=$rc"
          exit "$rc"

      - name: Show inline raw managed-startup evidence
        if: always()
        run: |
          for m in broken free; do
            O=/tmp/pg201553/managed-$m
            echo "########## $O ($m) ##########"
            grep -aE 'DISABLE_MARKER|LISTENERS_BEFORE|LAUNCHAGENT|APP_BINARY_SHA|STUB_CALLS|CHILD_|LISTENER_|PASS:|FAIL:|PROOF_FAIL|launch PATH' \
              /tmp/pg201553/managed-$m.log 2>/dev/null || true
            echo "----- discriminator lines from the app log -----"
            grep -aoE "externally managed[^\"]{0,60}|Could not (inspect port|determine whether port) [0-9]+[^\"\n]{0,60}|five failed starts" \
              "$O/app.log" 2>/dev/null | head -5 || true
          done

      - name: Upload managed-startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-managed-start
          path: |
            /tmp/pg201553/managed-broken/
            /tmp/pg201553/managed-free/
            /tmp/pg201553/managed-*.log

  # =========================================== absent-service migration (blocker)
  # Rev 10: the upgrade fixture installed pinned Bun, so captureAbsentService
  # (which requires an unpinned managed Node install with no pin record) was
  # never reached. This job installs with the default Node runtime, removes the
  # plist to make the service absent, and launches the candidate with broken lsof.
  migration-absent:
    name: migration-absent
    if: ${{ inputs.run == 'all' || inputs.run == 'migration' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout old stable app (v2026.11.10)
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: v2026.11.10
          path: old

      - name: Checkout PR head (candidate)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: 8ba0147560166a6ef593892719f3ef09605db2a6
          path: new

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Package the old stable app
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd old
          corepack enable
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          node scripts/prepare-apple-mermaid.mjs || true
          pnpm plugins:assets:build || true
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw

      - name: Package the candidate app
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd new
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/prepare-apple-mermaid.mjs
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old_line = "                    VideoPlayer(player: player.player)"
          new_line = "                    Color.black"
          if old_line in src:
              open(path, "w").write(src.replace(old_line, new_line, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY
          pnpm plugins:assets:build
          mkdir -p "$HOME/.openclaw"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          test -x dist/OpenClaw.app/Contents/MacOS/OpenClaw

      - name: Absent-service migration with an unreadable port
        env:
          APP_PATH: ${{ github.workspace }}/new/dist/OpenClaw.app
          OLD_RUNTIME: ${{ github.workspace }}/old/dist/OpenClaw.app/Contents/Resources/runtime
          OUT_DIR: /tmp/pg201553/migration-absent
          PROBE_DIR: ${{ github.workspace }}/proofrepo/probe
          GATEWAY_PORT: '18789'
          BUNDLE_ID: ai.openclaw.mac
        run: |
          set -o pipefail
          bash "$PROBE_DIR/migration-absent-capture.sh" migration-absent 2>&1 | tee /tmp/pg201553/migration-absent.log
          rc=${PIPESTATUS[0]}
          echo "MIGRATION_RC=$rc"
          exit "$rc"

      - name: Show inline raw migration evidence
        if: always()
        run: |
          O=/tmp/pg201553/migration-absent
          echo "===== key lines ====="
          grep -aE 'PLIST|PIN_DB|RESUME|STUB_CALLS|CHILD_|LISTENER_|PASS:|FAIL:|PROOF_FAIL|INSTALL_EXIT|intent' \
            /tmp/pg201553/migration-absent.log 2>/dev/null || true
          echo "===== unified log matches ====="
          grep -iE 'could not.*inspect|existing owner|preserved|migration|absent|port could not' \
            "$O/oslog.txt" 2>/dev/null | tail -15 || true

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg201553-migration-absent
          path: |
            /tmp/pg201553/migration-absent/
            /tmp/pg201553/migration-absent.log
