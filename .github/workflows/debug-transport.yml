name: Debug real transport classification
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: fix/launchd-runtime-bootstrap-teardown-deadline-wall-clock-181
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Debug classification
        shell: bash
        run: |
          UID_NUM="$(id -u)"
          cat > /tmp/probe.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>ai.openclaw.probe</string>
            <key>ProgramArguments</key><array><string>/bin/sleep</string><string>1</string></array>
          </dict></plist>
          PLIST
          cat > ./debug.ts <<'SCRIPT'
          const UID = process.env.UID_NUM!;
          const { execLaunchctl } = await import("./src/daemon/launchd-exec.ts");
          const res = await execLaunchctl(["bootstrap", "user/" + UID, "/tmp/probe.plist"]);
          console.log("termination:", res.termination);
          console.log("code:", res.code);
          console.log("stderr:", JSON.stringify(res.stderr));
          console.log("stdout:", JSON.stringify(res.stdout));
          const { isLaunchctlBootstrapPendingTeardown, isLaunchctlAlreadyLoaded, isUnsupportedGuiDomain, isLaunchctlOperationAlreadyInProgress } = await import("./src/daemon/launchd-runtime.ts");
          console.log("pendingTeardown:", isLaunchctlBootstrapPendingTeardown(res));
          console.log("alreadyLoaded:", isLaunchctlAlreadyLoaded(res));
          console.log("unsupportedGui:", isUnsupportedGuiDomain((res.stderr||res.stdout).trim()));
          console.log("opInProgress:", isLaunchctlOperationAlreadyInProgress((res.stderr||res.stdout).trim()));
          SCRIPT
          UID_NUM=$UID_NUM node --import tsx/esm ./debug.ts 2>&1 | tail -20
