name: macOS Native WKWebView Bridge XCTest (PR #182627)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR branch on SunnyShu0925/openclaw to test
        required: true
        default: fix/native-conversation-bridge-deadline-monotonic-172
      proof_ref:
        description: Exact proof harness revision
        required: true

jobs:
  production-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: parent
            ref: a2e646bc7343d31fa6446a978bf3d810d763c990
          - version: head
            ref: c7fb8202e193c22be02eee2ea280771d0d07f54f
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout production Host proof harness
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: ${{ inputs.proof_ref }}
          path: proof

      - name: Verify exact production revision
        env:
          PR_REF: ${{ matrix.ref }}
        run: |
          git init openclaw
          git -C openclaw remote add origin \
            https://github.com/SunnyShu0925/openclaw
          git -C openclaw fetch --depth 1 origin "$PR_REF"
          git -C openclaw checkout --detach FETCH_HEAD
          test "$(git -C openclaw rev-parse HEAD)" = "$PR_REF"
          if [[ "${{ matrix.version }}" == "parent" ]]; then
            git -C openclaw show HEAD:ui/src/app/native-conversation-bridge.ts | grep -F 'Date.now() + RESPONSE_TIMEOUT_MS'
          else
            git -C openclaw show HEAD:ui/src/app/native-conversation-bridge.ts | grep -F 'performance.now() + RESPONSE_TIMEOUT_MS'
          fi

      - name: Install production Host proof test
        run: |
          cp proof/apps/macos/Tests/OpenClawIPCTests/PR182627ProductionHostTests.swift \
            openclaw/apps/macos/Tests/OpenClawIPCTests/

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Setup Node (build plugin requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install deps (pnpm, for SwiftPM build-tool plugins)
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets (required by OpenClawChatUI resource bundle)
        working-directory: openclaw
        run: |
          node scripts/prepare-apple-mermaid.mjs

      - name: Run production Host ACK proof
        working-directory: openclaw
        continue-on-error: true
        run: |
          which node
          node -v
          swift test --package-path apps/macos --filter PR182627ProductionHostTests 2>&1 | tee "/tmp/${{ matrix.version }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect
        if: always()
        run: |
          test -f "/tmp/${{ matrix.version }}.log" || exit 1
          grep -F '[PR182627Host]' "/tmp/${{ matrix.version }}.log" || true
          tail -40 "/tmp/${{ matrix.version }}.log" || true

      - name: Enforce expected parent/head verdict
        env:
          PROOF_VERSION: ${{ matrix.version }}
          PRODUCTION_SHA: ${{ matrix.ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_SHA: ${{ github.sha }}
          PROOF_REF: ${{ inputs.proof_ref }}
        run: |
          log="/tmp/$PROOF_VERSION.log"
          provenance=$(mktemp "/tmp/production-host-$PROOF_VERSION-provenance.XXXXXX.json")
          gh api "repos/$REPOSITORY/actions/runs/$PROOF_RUN_ID" > "$provenance"
          test "$(jq -r .head_sha "$provenance")" = "$PROOF_SHA"
          test "$PROOF_SHA" = "$PROOF_REF"
          grep -F 'production page bridge error=none' "$log"
          grep -F '[PR182627Host] VERDICT:START' "$log"
          if [[ "$PROOF_VERSION" == "parent" ]]; then
            test "$(grep -cF 'VERDICT:START' "$log")" -eq 1
            grep -E 'first request=[0-9A-F-]+ host=ok=true error=none' "$log"
            grep -E 'second request=[0-9A-F-]+ queued=true' "$log"
            grep -F 'first page ack=ok=true error=none' "$log"
            grep -F 'first native ok=true error=none' "$log"
            grep -F 'first result host=ok=true error=none' "$log"
            grep -F 'second started=false' "$log"
            grep -F 'second native ok=false error=navigate-timeout' "$log"
            grep -F 'page={"firstHost":true,"firstPage":true,"secondStatus":"queued"}' "$log"
            test "$(grep -cF 'VERDICT:FAILED:navigate-timeout' "$log")" -eq 1
            test "$(grep -cF 'VERDICT:SUCCEEDED' "$log")" -eq 0
            test "$(grep -cF 'second host=' "$log")" -eq 0
            test "$(grep -cF 'second page ack=' "$log")" -eq 0
          else
            test "$(grep -cF 'VERDICT:START' "$log")" -eq 1
            grep -E 'first request=[0-9A-F-]+ host=ok=true error=none' "$log"
            grep -E 'second request=[0-9A-F-]+ queued=true' "$log"
            grep -F 'first page ack=ok=true error=none' "$log"
            grep -F 'first native ok=true error=none' "$log"
            grep -F 'first result host=ok=true error=none' "$log"
            grep -F 'second started=true' "$log"
            grep -F 'second host=ok=true error=none' "$log"
            grep -F 'second native ok=true error=none' "$log"
            grep -F 'second page ack=ok=true error=none' "$log"
            grep -F 'page={"firstHost":true,"firstPage":true,"secondStatus":"started"}' "$log"
            grep -E 'clock Date\.now delta=5[9-9][0-9]{3}ms|clock Date\.now delta=60[0-9]{3}ms' "$log"
            grep -E 'clock performance\.now delta=[0-9]+ms' "$log"
            test "$(grep -cF 'VERDICT:SUCCEEDED' "$log")" -eq 1
            test "$(grep -cF 'VERDICT:FAILED:' "$log")" -eq 0
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-host-${{ matrix.version }}
          path: /tmp/${{ matrix.version }}.log
