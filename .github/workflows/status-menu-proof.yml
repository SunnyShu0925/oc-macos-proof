name: Status menu inherit-default proof (PR 188938)

# Green here means the branch under test actually showed the claimed behavior:
# the probe asserts its expectations, the regression step asserts the expected
# exit code per mode, and the mode patch fails loudly when it no longer applies.

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR branch on SunnyShu0925/openclaw
        required: true
        default: fix/status-menu-off-inherit-default-187607
      mode:
        description: "head (fixed) or base (off manufactured again)"
        required: true
        default: head

jobs:
  proof:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout openclaw PR branch (fork)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ inputs.pr_branch }}
          path: openclaw

      - name: Checkout proof scripts
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version || true
          sw_vers

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install deps (SwiftPM build-tool plugins)
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: |
          node scripts/prepare-apple-mermaid.mjs

      - name: Stage probe + apply mode
        working-directory: openclaw
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          PROBE="apps/macos/Tests/OpenClawIPCTests/StatusMenuProbe.swift"
          cp "$GITHUB_WORKSPACE/proofrepo/probe/StatusMenuProbe.swift" "$PROBE"
          SOURCE=apps/macos/Sources/OpenClaw/StatusMenuSessions.swift
          echo "=== HEAD lines before mode ==="
          grep -n "let selected" "$SOURCE" | head -5
          if [ "$MODE" = "base" ]; then
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path("apps/macos/Sources/OpenClaw/StatusMenuSessions.swift")
          s = p.read_text()
          before = s
          s = s.replace(
              'let selected = levels.contains(current ?? "") ? current : nil',
              'let selected = levels.contains(current ?? "") ? current ?? "off" : "off"')
          s = s.replace(
              'let selected = current\n',
              'let selected = menu.items.contains {\n            ($0.representedObject as? [String: String])?["value"] == current\n        } ? current : "off"\n',
              1)
          assert s != before, "base revert did not apply"
          p.write_text(s)
          PY
          fi
          echo "=== lines after mode ($MODE) ==="
          grep -n "let selected" "$SOURCE" | head -5
          if [ "$MODE" = "base" ]; then
            grep -q 'current ?? "off" : "off"' "$SOURCE" || { echo "::error::base mode did not manufacture the Off fallback"; exit 1; }
          else
            grep -q 'levels.contains(current ?? "") ? current : nil' "$SOURCE" || { echo "::error::head mode is not the fixed shape"; exit 1; }
            grep -q 'let selected = current$' "$SOURCE" || { echo "::error::head mode still has the update-path fallback"; exit 1; }
          fi
          echo "=== git diff stat ==="
          git diff --stat

      - name: Build package tests
        working-directory: openclaw
        run: |
          set -o pipefail
          swift build --package-path apps/macos --build-system native --build-tests 2>&1 | tee /tmp/build-${{ inputs.mode }}.log

      - name: Run status menu probe (asserts expected checkmarks)
        working-directory: openclaw
        timeout-minutes: 12
        env:
          PROBE_OUT_DIR: /tmp/probe-out
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p /tmp/probe-out
          set -o pipefail
          swift test --package-path apps/macos --build-system native --filter StatusMenuProbe 2>&1 | tee /tmp/probe-${{ inputs.mode }}.log

      - name: Run focused regression (exit code asserted per mode)
        working-directory: openclaw
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          set +e
          swift test --package-path apps/macos --build-system native --filter "StatusMenuSummariesTests" 2>&1 | tee /tmp/regression-$MODE.log
          EXIT=${PIPESTATUS[0]}
          echo "REGRESSION_EXIT=$EXIT" | tee -a /tmp/regression-$MODE.log
          if [ "$MODE" = "base" ]; then
            [ "$EXIT" -ne 0 ] || { echo "::error::base regression passed; the reverted branch should fail the new test"; exit 1; }
          else
            [ "$EXIT" -eq 0 ] || { echo "::error::head regression failed"; exit 1; }
          fi

      - name: Collect
        if: ${{ always() }}
        run: |
          echo "=== BUILD tail (${{ inputs.mode }}) ==="
          tail -25 /tmp/build-${{ inputs.mode }}.log 2>/dev/null || true
          echo "=== PROBE key lines (${{ inputs.mode }}) ==="
          grep -E "PROBE |SCENARIO |SUBMENU |ITEM |ANY_ON |CHECK |PROBE_DONE|error:|Test Suite|passed|failed" /tmp/probe-${{ inputs.mode }}.log 2>/dev/null | head -160 || true
          echo "=== REGRESSION key lines (${{ inputs.mode }}) ==="
          grep -E "Test Suite|passed|failed|error:|REGRESSION_EXIT|inherits the agent default" /tmp/regression-${{ inputs.mode }}.log 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: status-menu-proof-${{ inputs.mode }}
          path: |
            /tmp/build-${{ inputs.mode }}.log
            /tmp/probe-${{ inputs.mode }}.log
            /tmp/regression-${{ inputs.mode }}.log
