name: proof-190152

on:
  workflow_dispatch:
    inputs:
      run:
        description: which evidence to produce
        required: true
        default: all
        type: choice
        options:
          - all
          - head
          - base
          - upgrade

permissions:
  contents: read

env:
  PR_BRANCH: proof/macos-portguardian-inconclusive-190152
  FORK: SunnyShu0925/openclaw
  # Every changed file is macOS-only, so this is the one platform that applies.
  GATEWAY_PORT: '18789'

jobs:
  onboarding-head:
    if: ${{ inputs.run == 'all' || inputs.run == 'head' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout PR proof branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK }}
          ref: ${{ env.PR_BRANCH }}
          path: openclaw

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version || true
          ls -d /Applications/Xcode*.app || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          assert old in src, "expected VideoPlayer line not found"
          open(path, "w").write(src.replace(old, new, 1))
          PY
          git diff --stat

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package the app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 80
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          ls -la dist/OpenClaw.app/Contents/MacOS/ || true

      - name: Capture onboarding with a broken lsof
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/capture
        run: |
          set -o pipefail
          bash proofrepo/probe/onboarding-capture.sh head-broken broken 2>&1 | tee /tmp/capture-head-broken.log

      - name: Capture onboarding with the real lsof
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/capture
        run: |
          set -o pipefail
          bash proofrepo/probe/onboarding-capture.sh head-healthy healthy 2>&1 | tee /tmp/capture-head-healthy.log

      - name: Assert the shipped copy follows the probe outcome
        run: |
          set -uo pipefail
          fail=0
          check() { local l="$1"; shift; if "$@"; then echo "PASS: $l"; else echo "FAIL: $l"; fail=1; fi; }
          UNKNOWN="Could not check whether port"
          DEFAULT_COPY="Installs and starts automatically"
          BROKEN="/tmp/capture/ax-head-broken-connection.txt /tmp/capture/ocr-head-broken-connection.txt"
          HEALTHY="/tmp/capture/ax-head-healthy-connection.txt /tmp/capture/ocr-head-healthy-connection.txt"
          copy_has() { grep -qiE "$1" $2 2>/dev/null; }
          copy_lacks() { ! grep -qiE "$1" $2 2>/dev/null; }
          echo "--- sources ---"
          for f in $BROKEN $HEALTHY; do echo "$f: $(wc -l < "$f" 2>/dev/null || echo 0) lines"; done
          check "broken probe reached the shipped probe stub" \
            test -s /tmp/capture/poison-head-broken/calls.log
          check "the app asked for the Gateway port" \
            grep -q -- "-iTCP:18789" /tmp/capture/poison-head-broken/calls.log
          check "broken probe shows the unknown-port copy" copy_has "$UNKNOWN" "$BROKEN"
          check "broken probe drops the automatic-install promise" copy_lacks "$DEFAULT_COPY" "$BROKEN"
          check "healthy probe keeps the default copy" copy_has "$DEFAULT_COPY" "$HEALTHY"
          check "healthy probe does not claim the port is unreadable" copy_lacks "$UNKNOWN" "$HEALTHY"
          echo "PROOF_FAIL=$fail"
          exit "$fail"

      - name: Show the captured copy
        if: always()
        run: |
          for f in /tmp/capture/ax-*-connection.txt; do
            echo "=== $f ==="
            grep -E "Installs and starts automatically|Could not check whether port|Where should your assistant run" "$f" | head -6 || true
          done
          echo "=== stub calls ==="
          cat /tmp/capture/poison-head-broken/calls.log 2>/dev/null | head -10 || true
          ls -la /tmp/capture/*.png 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-head
          path: |
            /tmp/capture/ax-*.txt
            /tmp/capture/*.png
            /tmp/capture/poison-*
            /tmp/capture-head-*.log

  onboarding-base:
    if: ${{ inputs.run == 'all' || inputs.run == 'base' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: main
          path: openclaw

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Patch unrelated ChatUI build break
        working-directory: openclaw
        run: |
          set -euo pipefail
          echo "BASE_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== the conflating guard on this base ==="
          grep -n "guard res.ok" apps/macos/Sources/OpenClaw/PortGuardian.swift || true
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "                    VideoPlayer(player: player.player)"
          new = "                    Color.black"
          if old in src:
              open(path, "w").write(src.replace(old, new, 1))
              print("patched the unrelated ChatUI break")
          else:
              print("no ChatUI break on this tree")
          PY

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package the app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 80
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          ls -la dist/OpenClaw.app/Contents/MacOS/ || true

      - name: Capture onboarding with a broken lsof
        env:
          APP_PATH: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
          OUT_DIR: /tmp/capture
        run: |
          set -o pipefail
          bash proofrepo/probe/onboarding-capture.sh base-broken broken 2>&1 | tee /tmp/capture-base-broken.log

      - name: Assert the base still promises an automatic install
        run: |
          set -uo pipefail
          fail=0
          check() { local l="$1"; shift; if "$@"; then echo "PASS: $l"; else echo "FAIL: $l"; fail=1; fi; }
          SRC="/tmp/capture/ax-base-broken-connection.txt /tmp/capture/ocr-base-broken-connection.txt"
          copy_has() { grep -qiE "$1" $2 2>/dev/null; }
          copy_lacks() { ! grep -qiE "$1" $2 2>/dev/null; }
          for f in $SRC; do echo "$f: $(wc -l < "$f" 2>/dev/null || echo 0) lines"; done
          check "base app reached the probe stub" test -s /tmp/capture/poison-base-broken/calls.log
          check "base promises an automatic install despite the failed probe" \
            copy_has "Installs and starts automatically" "$SRC"
          check "base never says the port could not be checked" \
            copy_lacks "Could not check whether port" "$SRC"
          echo "BASE_FAIL=$fail"
          exit "$fail"

      - name: Show the captured copy
        if: always()
        run: |
          grep -E "Installs and starts automatically|Could not check whether port" \
            /tmp/capture/ax-base-broken-connection.txt | head -6 || true
          cat /tmp/capture/poison-base-broken/calls.log 2>/dev/null | head -10 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-base
          path: |
            /tmp/capture/ax-*.txt
            /tmp/capture/*.png
            /tmp/capture/poison-*
            /tmp/capture-base-broken.log

  upgrade:
    if: ${{ inputs.run == 'all' || inputs.run == 'upgrade' }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout latest stable (v2026.11.10)
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: v2026.11.10
          path: old

      - name: Checkout PR proof branch (candidate)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK }}
          ref: ${{ env.PR_BRANCH }}
          path: new

      - name: Checkout proof tooling
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Package the latest stable build
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd old
          corepack enable
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          node scripts/prepare-apple-mermaid.mjs || true
          pnpm plugins:assets:build || true
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          ls -la dist/OpenClaw.app/Contents/Resources/runtime/bin/ || true

      - name: Package the candidate build
        timeout-minutes: 85
        env:
          ALLOW_ADHOC_SIGNING: '1'
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          cd new
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/prepare-apple-mermaid.mjs
          FILE=apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatMediaVideoAttachment.swift
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old_line = "                    VideoPlayer(player: player.player)"
          new_line = "                    Color.black"
          assert old_line in src, "expected VideoPlayer line not found"
          open(path, "w").write(src.replace(old_line, new_line, 1))
          PY
          pnpm plugins:assets:build
          ./scripts/package-mac-app.sh 2>&1 | tail -120
          ls -la dist/OpenClaw.app/Contents/Resources/runtime/bin/ || true

      - name: Run the real upgrade
        env:
          OUT_DIR: /tmp/upgrade
          OLD_RUNTIME: ${{ github.workspace }}/old/dist/OpenClaw.app/Contents/Resources/runtime
          NEW_RUNTIME: ${{ github.workspace }}/new/dist/OpenClaw.app/Contents/Resources/runtime
        run: |
          set -o pipefail
          mkdir -p /tmp/upgrade
          bash proofrepo/probe/upgrade-preservation.sh 2>&1 | tee /tmp/upgrade/upgrade.log

      - name: Show the upgrade result
        if: always()
        run: |
          grep -E "PASS:|FAIL:|PLIST_SHA|UPGRADE_FAIL|OLD_INSTALL_EXIT|RESUME_|OLD_BUN|NEW_BUN|HOME=|STATE_DIR=" \
            /tmp/upgrade/upgrade.log | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade
          path: |
            /tmp/upgrade/
