name: macOS Stop-Deadline Proof (PR #183033)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR branch on SunnyShu0925/openclaw to test
        required: true
        default: fix/launchd-stop-deadline-monotonic-180

jobs:
  proof:
    runs-on: macos-14
    steps:
      - name: Checkout openclaw PR branch (fork)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw

      - name: Checkout proof scripts
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install deps (pnpm)
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # --- unload bounded-expiry scenario (job stays loaded, PID alive) ---
      - name: Unload scenario FIXED (performance.now)
        working-directory: openclaw
        run: bash $GITHUB_WORKSPACE/proofrepo/.github/workflows/run-stop-proof.sh
        env:
          VARIANT: FIXED
          SCENARIO: unload
          WALL_JUMP_MS: 1000000
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw

      - name: Unload scenario OLD (Date.now deadline)
        working-directory: openclaw
        run: bash $GITHUB_WORKSPACE/proofrepo/.github/workflows/run-stop-proof.sh
        env:
          VARIANT: OLD
          SCENARIO: unload
          WALL_JUMP_MS: 1000000
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw

      # --- port-release bounded-expiry scenario (unload completes, port busy) ---
      - name: Port-release scenario FIXED (performance.now)
        working-directory: openclaw
        run: bash $GITHUB_WORKSPACE/proofrepo/.github/workflows/run-stop-proof.sh
        env:
          VARIANT: FIXED
          SCENARIO: port
          WALL_JUMP_MS: 1000000
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw

      - name: Port-release scenario OLD (Date.now deadline)
        working-directory: openclaw
        run: bash $GITHUB_WORKSPACE/proofrepo/.github/workflows/run-stop-proof.sh
        env:
          VARIANT: OLD
          SCENARIO: port
          WALL_JUMP_MS: 1000000
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw

      - name: Collect verdict
        if: always()
        run: |
          echo "=== VERDICT SUMMARY ==="
          grep -h "VERDICT\|head=" /tmp/stop-*.log 2>/dev/null || echo "no verdict lines"
          echo ""
          echo "=== raw outcomes ==="
          for f in /tmp/stop-*.log; do
            [ -f "$f" ] && echo "--- $f ---" && grep -E "VERDICT|settled_at|busy port|live child" "$f"
          done
