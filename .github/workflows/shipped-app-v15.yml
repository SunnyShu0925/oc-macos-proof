name: shipped-app-events-v15
'on':
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR head branch
        required: true
        default: fix/agent-events-window-id-187608
      mode:
        description: head or base
        required: true
        default: head
jobs:
  proof:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APP_BUNDLE_ID: ai.openclaw.mac.debug
      APP_EXEC: dist/OpenClaw.app/Contents/MacOS/OpenClaw
    steps:
    - name: Checkout proof harness
      uses: actions/checkout@v4
      with:
        path: proof
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        repository: SunnyShu0925/openclaw
        ref: ${{ inputs.pr_branch }}
        path: openclaw
    - name: Toolchain
      run: 'sw_vers

        swift --version

        xcodebuild -version

        '
    - name: Setup Node + pnpm
      run: 'corepack enable

        node --version || true

        '
    - name: Install dependencies
      working-directory: openclaw
      timeout-minutes: 25
      run: pnpm install --frozen-lockfile
    - name: Prepare apple mermaid assets
      working-directory: openclaw
      run: node scripts/prepare-apple-mermaid.mjs
    - name: Apply mode (base reverts the one-line fix)
      working-directory: openclaw
      env:
        MODE: ${{ inputs.mode }}
      run: "set -euo pipefail\nSRC=apps/macos/Sources/OpenClaw/AgentEventsWindow.swift\nif [ \"$MODE\" = \"base\" ]; then\n  python3 - \"$SRC\" <<'PY'\nimport sys, pathlib\np = pathlib.Path(sys.argv[1])\ns = p.read_text()\nif \"id: \\\\.id\" not in s:\n    raise SystemExit(\"expected id: \\\\.id in \" + str(p))\np.write_text(s.replace(\"id: \\\\.id\", \"id: \\\\.seq\"))\nprint(\"BASE mode: reverted to id: \\\\.seq\")\nPY\nfi\ngrep -n \"ForEach\" \"$SRC\" | head -3\n"
    - name: Build plugin assets
      working-directory: openclaw
      timeout-minutes: 20
      run: pnpm plugins:assets:build
    - name: Package app (ad-hoc)
      working-directory: openclaw
      timeout-minutes: 70
      env:
        ALLOW_ADHOC_SIGNING: '1'
        SIGN_IDENTITY: '-'
        OPENCLAW_PACKAGE_APP_ROOT: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
      run: 'set -euo pipefail

        mkdir -p "$HOME/.openclaw"

        touch "$HOME/.openclaw/disable-launchagent"

        ./scripts/package-mac-app.sh 2>&1 | tail -80

        ls -la "$APP_EXEC"

        plutil -p dist/OpenClaw.app/Contents/Info.plist | grep -E ''CFBundleIdentifier|LSUIElement'' || true

        codesign -dv dist/OpenClaw.app 2>&1 | head -5 || true

        '
    - name: Write config + stub model + start Gateway
      working-directory: openclaw
      run: "set -euo pipefail\nmkdir -p \"$HOME/.openclaw\"\ncat > \"$HOME/.openclaw/openclaw.json\" <<'JSON'\n{\n  \"gateway\": { \"mode\": \"local\", \"port\": 18789, \"auth\": { \"mode\": \"none\" } },\n  \"models\": {\n    \"providers\": {\n      \"stub\": {\n        \"baseUrl\": \"http://127.0.0.1:18999/v1\",\n        \"api\": \"openai-completions\",\n        \"apiKey\": \"stub-key\",\n        \"models\": [\n          {\n            \"id\": \"stub-1\",\n            \"name\": \"Stub 1\",\n            \"compat\": { \"supportsTools\": false, \"requiresStringContent\": true, \"strictMessageKeys\": true }\n          }\n        ]\n      }\n    }\n  },\n  \"agents\": { \"defaults\": { \"model\": { \"primary\": \"stub/stub-1\" } }, \"entries\": { \"main\": {} } }\n}\nJSON\ncat > /tmp/stub-model.mjs <<'JS'\nimport http from \"node:http\";\nconst port = Number(process.env.STUB_PORT || 18999);\nconst server = http.createServer((req, res) => {\n  let body = \"\";\n  req.on(\"data\", (c) => { body\
        \ += c; });\n  req.on(\"end\", () => {\n    if (req.url.startsWith(\"/v1/models\")) {\n      res.writeHead(200, { \"content-type\": \"application/json\" });\n      res.end(JSON.stringify({ object: \"list\", data: [{ id: \"stub-1\", object: \"model\" }] }));\n      return;\n    }\n    if (!req.url.includes(\"/chat/completions\")) {\n      res.writeHead(404); res.end(\"not found\"); return;\n    }\n    let parsed = {};\n    try { parsed = JSON.parse(body || \"{}\"); } catch {}\n    const id = \"chatcmpl-stub-\" + Date.now();\n    const created = Math.floor(Date.now() / 1000);\n    const model = parsed.model || \"stub-1\";\n    if (parsed.stream === false) {\n      res.writeHead(200, { \"content-type\": \"application/json\" });\n      res.end(JSON.stringify({\n        id, object: \"chat.completion\", created, model,\n        choices: [{ index: 0, message: { role: \"assistant\", content: \"stub reply\" }, finish_reason: \"stop\" }],\n        usage: { prompt_tokens: 1, completion_tokens:\
        \ 2, total_tokens: 3 }\n      }));\n      return;\n    }\n    res.writeHead(200, {\n      \"content-type\": \"text/event-stream\",\n      \"cache-control\": \"no-cache\",\n      connection: \"keep-alive\"\n    });\n    const chunk = (delta, finish = null) => \"data: \" + JSON.stringify({\n      id, object: \"chat.completion.chunk\", created, model,\n      choices: [{ index: 0, delta, finish_reason: finish }]\n    }) + \"\\n\\n\";\n    res.write(chunk({ role: \"assistant\", content: \"\" }));\n    res.write(chunk({ content: \"stub reply\" }));\n    res.write(chunk({}, \"stop\"));\n    res.write(\"data: [DONE]\\n\\n\");\n    res.end();\n  });\n});\nserver.listen(port, \"127.0.0.1\", () => console.log(\"stub model listening on \" + port));\nJS\npnpm openclaw doctor --fix > /tmp/doctor.log 2>&1 || true\ntail -25 /tmp/doctor.log || true\nnohup node /tmp/stub-model.mjs > /tmp/stub.log 2>&1 &\nnohup pnpm openclaw gateway run > /tmp/gateway.log 2>&1 &\nfor i in $(seq 1 120); do\n  if nc\
        \ -z 127.0.0.1 18789 2>/dev/null; then echo \"gateway port open after $((i*5))s\"; break; fi\n  sleep 5\ndone\nnc -z 127.0.0.1 18789 && echo \"PORT_OPEN\" || echo \"PORT_CLOSED_AFTER_WAIT\"\necho \"--- stub ---\"; tail -5 /tmp/stub.log || true\necho \"--- gateway ---\"; tail -30 /tmp/gateway.log || true\npnpm openclaw gateway status || true\n"
    - name: Enable debug pane + launch packaged app
      working-directory: openclaw
      run: "set -x\ndefaults write \"$APP_BUNDLE_ID\" openclaw.debugPaneEnabled -bool true\ndefaults write \"$APP_BUNDLE_ID\" openclaw.onboardingSeen -bool true\ndefaults write \"$APP_BUNDLE_ID\" openclaw.onboardingVersion -int 8\ndefaults read \"$APP_BUNDLE_ID\" openclaw.debugPaneEnabled\ndefaults read \"$APP_BUNDLE_ID\" openclaw.onboardingSeen\npkill -f \"OpenClaw.app/Contents/MacOS/OpenClaw\" || true\nsleep 1\nopen \"$PWD/dist/OpenClaw.app\" --args --attach-only --debug-open-menu\nAPP_PID=\"\"\nfor i in $(seq 1 60); do\n  APP_PID=$(pgrep -f \"OpenClaw.app/Contents/MacOS/OpenClaw\" | head -1)\n  if [ -n \"$APP_PID\" ]; then echo \"APP_UP after ${i}s (pid $APP_PID)\"; break; fi\n  sleep 1\ndone\n[ -n \"$APP_PID\" ] || { echo \"APP_NOT_RUNNING\"; exit 1; }\necho \"APP_PID=$APP_PID\" >> \"$GITHUB_ENV\"\nsleep 8\nps -p \"$APP_PID\" -o pid,comm,args || true\necho \"--- frontmost ---\"\nosascript -e 'tell application \"System Events\" to get name of first process whose frontmost is true' ||\
        \ true\n"
    - name: Open Debug -> Open Agent Events (status menu, AX)
      working-directory: openclaw
      continue-on-error: true
      run: 'APP_PID="$APP_PID" osascript "$GITHUB_WORKSPACE/proof/probe/open-agent-events.applescript" 2>&1 | tee /tmp/menu.log

        echo "---"

        screencapture -x /tmp/full-screen-menu.png || true

        file /tmp/full-screen-menu.png || true

        '
    - name: Approve pending device
      working-directory: openclaw
      continue-on-error: true
      run: "set +e\npnpm openclaw devices list --json > /tmp/devices-before.json 2>&1 || true\ntail -c 1500 /tmp/devices-before.json\npython3 - > /tmp/pending.txt <<'PYDEV'\nimport json, re\nraw = open('/tmp/devices-before.json').read()\nm = re.search(r\"\\{.*\\}\", raw, re.S)\ntry:\n    parsed = json.loads(m.group(0)) if m else {}\nexcept Exception:\n    parsed = {}\nfor p in parsed.get(\"pending\", []) or []:\n    print(p.get(\"requestId\") or p.get(\"id\") or \"\")\nPYDEV\necho \"--- pending ids ---\"; cat /tmp/pending.txt\nwhile read -r rid; do\n  if [ -n \"$rid\" ]; then pnpm openclaw devices approve \"$rid\" 2>&1 | tail -3; fi\ndone < /tmp/pending.txt\nsleep 10\npnpm openclaw devices list --json > /tmp/devices.json 2>&1 || true\ntail -c 1200 /tmp/devices.json\ngrep -o \"client=[a-zA-Z-]*\" /tmp/gateway.log | sort | uniq -c || true\n"
    - name: Agent turn A
      working-directory: openclaw
      continue-on-error: true
      run: "pnpm openclaw agent --session-id events-a --message \"Reply with the single word: alpha\" --json \\\n  > /tmp/turn-a.json 2>/tmp/turn-a.err || true\nhead -20 /tmp/turn-a.json || true\ntail -10 /tmp/turn-a.err || true\nsleep 3\n"
    - name: Agent turn B (window already open, same seq numbers)
      working-directory: openclaw
      continue-on-error: true
      run: "pnpm openclaw agent --session-id events-b --message \"Reply with the single word: beta\" --json \\\n  > /tmp/turn-b.json 2>/tmp/turn-b.err || true\nhead -20 /tmp/turn-b.json || true\ntail -10 /tmp/turn-b.err || true\nsleep 5\n"
    - name: Capture shipped window (top, tall, scrolled bottom)
      run: "set +e\nAPP_PID=\"$APP_PID\"\nP=\"$GITHUB_WORKSPACE/proof/probe\"\nswift \"$P/window-capture.swift\" 2>&1 | tee /tmp/windows-top.txt\nWID=$(sed -n 's/^AGENT_EVENTS_WID=//p' /tmp/windows-top.txt | head -1)\nRECT=$(sed -n 's/^AGENT_EVENTS_RECT=//p' /tmp/windows-top.txt | head -1)\necho \"top WID=$WID RECT=$RECT\"\nif [ -n \"$WID\" ]; then screencapture -x -o -l \"$WID\" /tmp/agent-events-window.png || true; fi\nif [ ! -s /tmp/agent-events-window.png ] && [ -n \"$RECT\" ]; then screencapture -x -R\"$RECT\" /tmp/agent-events-window.png || true; fi\nfile /tmp/agent-events-window.png || true\nAPP_PID=\"$APP_PID\" osascript \"$P/ax-rows.applescript\" 2>&1 | tee /tmp/rows-top.txt\nAPP_PID=\"$APP_PID\" osascript \"$P/ax-tree.applescript\" 2>&1 | tee /tmp/ax-tree-top.txt\n\ncat > /tmp/grow.applescript <<'AS'\ntell application \"System Events\"\n  tell process \"OpenClaw\"\n    set win to window \"Agent Events\"\n    perform action \"AXRaise\" of win\n    set {w, h} to size of win\n   \
        \ set size of win to {w, 1400}\n    delay 0.8\n    return \"RESIZED \" & (size of win as string)\n  end tell\nend tell\nAS\nosascript /tmp/grow.applescript 2>&1 | tee /tmp/grow.log\nsleep 1\nWIDT=$(swift \"$P/window-capture.swift\" 2>/dev/null | sed -n 's/^AGENT_EVENTS_WID=//p' | head -1)\nif [ -n \"$WIDT\" ]; then screencapture -x -o -l \"$WIDT\" /tmp/agent-events-window-tall.png || true; fi\nfile /tmp/agent-events-window-tall.png || true\nswift \"$P/ocr-window.swift\" /tmp/agent-events-window-tall.png 2>&1 | tee /tmp/window-ocr-tall.txt || true\nAPP_PID=\"$APP_PID\" osascript \"$P/ax-tree.applescript\" 2>&1 | tee /tmp/ax-tree-tall.txt\n\ncat > /tmp/scroll.applescript <<'AS'\ntell application \"System Events\"\n  tell process \"OpenClaw\"\n    set win to window \"Agent Events\"\n    perform action \"AXRaise\" of win\n    -- try the accessibility scrollbar wherever it is nested\n    try\n      repeat with e in (entire contents of win)\n        try\n          if role of e is \"AXScrollArea\"\
        \ then\n            set value of scroll bar 1 of e to 1.0\n          end if\n        end try\n      end repeat\n    end try\n    delay 0.5\n    -- keyboard fallback: focus the list, then page down to the bottom\n    set {x, y} to position of win\n    set {w, h} to size of win\n    click at {x + (w / 2), y + (h / 2)}\n    delay 0.4\n    repeat 8 times\n      key code 121\n      delay 0.15\n    end repeat\n    key code 119\n    delay 1.0\n    return \"SCROLLED\"\n  end tell\nend tell\nAS\nosascript /tmp/scroll.applescript 2>&1 | tee /tmp/scroll.log\nsleep 1\nWIDB=$(swift \"$P/window-capture.swift\" 2>/dev/null | sed -n 's/^AGENT_EVENTS_WID=//p' | head -1)\nif [ -n \"$WIDB\" ]; then screencapture -x -o -l \"$WIDB\" /tmp/agent-events-window-bottom.png || true; fi\nfile /tmp/agent-events-window-bottom.png || true\nswift \"$P/ocr-window.swift\" /tmp/agent-events-window-bottom.png 2>&1 | tee /tmp/window-ocr-bottom.txt || true\nAPP_PID=\"$APP_PID\" osascript \"$P/ax-tree.applescript\" 2>&1\
        \ | tee /tmp/ax-tree-bottom.txt\nAPP_PID=\"$APP_PID\" osascript \"$P/ax-rows.applescript\" 2>&1 | tee /tmp/rows-after.txt\nscreencapture -x /tmp/full-screen.png || true\necho \"--- rows ---\"; cat /tmp/rows-after.txt || true\necho \"--- app log ---\"; tail -40 /tmp/app.log 2>/dev/null || true\n"
    - name: Assert shipped-app proof
      run: "set -euo pipefail\necho \"== window capture ==\"\ntest -s /tmp/agent-events-window.png\nfile /tmp/agent-events-window*.png || true\npython3 - <<'PY'\nimport re, sys\nUUID = re.compile(r'run\\s+([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})')\n\ndef read(path):\n    try:\n        return open(path, errors='replace').read()\n    except FileNotFoundError:\n        return ''\n\ndef ids(text):\n    return sorted(set(u.lower() for u in UUID.findall(text)))\n\ndef loose_hits(text, uuids):\n    flat = text.lower().replace('-', '').replace(' ', '').replace('\\n', '')\n    return [u for u in uuids if u.replace('-', '') in flat]\n\nax = ids(read('/tmp/ax-tree-bottom.txt'))\nexpected = 1 if '${{ inputs.mode }}' == 'base' else 2\nprint('AX run ids (live window):', ax)\nif len(ax) != expected:\n    sys.exit('proof failed: expected %d rendered run id(s), saw %r' % (expected, ax))\nif expected == 2:\n    ocr_tall = read('/tmp/window-ocr-tall.txt')\n    ocr_bottom\
        \ = read('/tmp/window-ocr-bottom.txt')\n    hits_tall = loose_hits(ocr_tall, ax)\n    hits_bottom = loose_hits(ocr_bottom, ax)\n    print('OCR tall hits  :', hits_tall)\n    print('OCR bottom hits:', hits_bottom)\n    if len(hits_tall) < 2 and len(hits_bottom) < 2:\n        sys.exit('proof failed: no single screenshot shows both runs (tall=%r bottom=%r)' % (hits_tall, hits_bottom))\n    print('OK: one screenshot shows both runs, AX tree lists both')\nelse:\n    print('OK: base mode renders a single run')\nPY\n"
    - name: Collect
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shipped-app-events-v15-${{ inputs.mode }}
        path: '/tmp/agent-events-window.png

          /tmp/agent-events-window-tall.png

          /tmp/agent-events-window-bottom.png

          /tmp/window-ocr-tall.txt

          /tmp/window-ocr-bottom.txt

          /tmp/ax-tree-top.txt

          /tmp/ax-tree-tall.txt

          /tmp/ax-tree-bottom.txt

          /tmp/rows-top.txt

          /tmp/rows-after.txt

          /tmp/windows-top.txt

          /tmp/windows-tall.txt

          /tmp/grow.log

          /tmp/scroll.log

          /tmp/full-screen.png

          /tmp/menu.log

          /tmp/turn-a.json

          /tmp/turn-b.json

          /tmp/gateway.log

          /tmp/stub.log

          /tmp/doctor.log

          /tmp/devices.json

          /tmp/app.log

          /tmp/window-ocr.txt'
