name: Native conversation running UI proof (PR #182627)

on:
  workflow_call:
    inputs:
      head:
        required: true
        type: string
      harness:
        required: true
        type: string
      native_head:
        required: true
        type: string

jobs:
  proof:
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PR182627_HEAD: ${{ inputs.head }}
      PR182627_HARNESS: ${{ inputs.harness }}
      PR182627_NATIVE_HEAD: ${{ inputs.native_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ env.PR182627_HEAD }}
          path: post
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ env.PR182627_HEAD }}
          path: pre
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout proof harness
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: ${{ env.PR182627_HARNESS }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install post-fix checkout
        working-directory: post
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir ui exec playwright install webkit
      - name: Prepare exact pre-fix checkout
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git -C post rev-parse HEAD)" = "$PR182627_HEAD"
          test "$(git -C pre rev-parse HEAD)" = "$PR182627_HEAD"
          harness_head=$(git -C harness rev-parse HEAD)
          harness_input_head=$(git -C harness rev-parse "$PR182627_HARNESS^{commit}")
          echo "harness head=$harness_head input=$PR182627_HARNESS input_head=$harness_input_head"
          test "$harness_head" = "$harness_input_head"
          file=ui/src/app/native-conversation-bridge.ts
          test_file=ui/src/app/native-conversation-running-ui.browser.test.ts
          config_file=ui/vitest.config.ts
          for checkout in post pre; do
            test -f "$checkout/$file"
            test -f "$checkout/ui/test-helpers/control-ui-e2e.ts"
            test -f "$checkout/ui/vitest.config.ts"
            test -d "$checkout/apps/macos/Tests/OpenClawIPCTests"
          done
          git -C post show "$PR182627_HEAD^:$file" > pre/"$file"
          grep -q 'deadline = performance.now()' post/$file
          grep -q 'deadline = Date.now()' pre/$file
          diff -u post/$file pre/$file > "$GITHUB_WORKSPACE/bridge.diff" || true
          cp harness/.github/workflows/native-conversation-running-ui.browser.test.ts \
            "post/$test_file"
          cp harness/.github/workflows/native-conversation-running-ui.browser.test.ts \
            "pre/$test_file"
          for checkout in post pre; do
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const source = fs.readFileSync(file, "utf8");
              const marker = "const webkitTestFiles = [";
              const entry = "\n  \"src/app/native-conversation-running-ui.browser.test.ts\",";
              if (!source.includes(entry.trim())) {
                if (source.split(marker).length !== 2) {
                  throw new Error("WebKit test registry marker missing or ambiguous");
                }
                fs.writeFileSync(file, source.replace(marker, marker + entry));
              }
            ' \
            "$checkout/$config_file"
          done
          git -C post status --short > "$GITHUB_WORKSPACE/post.status"
          git -C pre status --short > "$GITHUB_WORKSPACE/pre.status"
          status_ok=1
          for path in "$file" "$test_file" "$config_file"; do
            for checkout in post pre; do
              if test -z "$(git -C "$checkout" status --short -- "$path")"; then
                echo "Expected proof change missing: $checkout/$path"
                status_ok=0
              fi
              if test "$(git -C "$checkout" diff --numstat -- "$path" |
                wc -l)" -ne 1; then
                echo "Unexpected tracked changes: $checkout/$path"
                status_ok=0
              fi
            done
          done
          if test "$status_ok" -ne 1; then
            echo "Proof checkouts do not match the intended patch."
            cat "$GITHUB_WORKSPACE/post.status"
            cat "$GITHUB_WORKSPACE/pre.status"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/bridge.diff" "$GITHUB_WORKSPACE/tree.diff"
          : > "$GITHUB_WORKSPACE/proof-harness.diff"
          comparison_ok=1
          for path in "$test_file" "$config_file"; do
            set +e
            diff -u "post/$path" "pre/$path" >> "$GITHUB_WORKSPACE/proof-harness.diff"
            comparison_status=$?
            set -e
            echo "proof comparison $path: exit=$comparison_status"
            if test "$comparison_status" -ne 0; then
              comparison_ok=0
            fi
          done
          if test "$comparison_ok" -ne 1; then
            echo "Proof harness checkouts differ from each other:"
            cat "$GITHUB_WORKSPACE/proof-harness.diff"
            exit 1
          fi
          shasum post/ui/src/app/native-conversation-running-ui.browser.test.ts > "$GITHUB_WORKSPACE/harness.sha256"
          cat "$GITHUB_WORKSPACE/bridge.diff"
          cat "$GITHUB_WORKSPACE/tree.diff"
      - name: Install pre-fix dependencies
        working-directory: pre
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir ui exec playwright install webkit
      - name: Production Control UI and WebKit environment
        working-directory: post
        run: |
          {
            echo "PR_HEAD=$(git rev-parse HEAD)"
            echo "PR_PARENT=$(git rev-parse HEAD^)"
            echo "HARNESS_HEAD=$(git -C ../harness rev-parse HEAD)"
            echo "RUNNER_OS=$RUNNER_OS RUNNER_IMAGE=$ImageOS RUNNER_ARCH=$RUNNER_ARCH"
            echo "NODE=$(node --version)"
            echo "PNPM=$(pnpm --version)"
            echo "PLAYWRIGHT=$(pnpm --dir ui exec playwright --version)"
          } | tee "$GITHUB_WORKSPACE/environment.log"
      - name: Run post-fix WebKit proof
        working-directory: post
        env:
          OPENCLAW_UI_WEBKIT: "1"
          PR182627_PROOF_VARIANT: post-fix
        run: |
          set -o pipefail
          pnpm --dir ui exec vitest run --config vitest.config.ts --project=webkit \
            --maxWorkers=1 src/app/native-conversation-running-ui.browser.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/postfix.log"
          grep -q 'VERDICT:post-fix:SUCCEEDED:none' "$GITHUB_WORKSPACE/postfix.log"
          grep -q 'queue held 2[0-9][0-9][0-9]ms' "$GITHUB_WORKSPACE/postfix.log"
          grep -q 'actual router RPC .*session=agent:main:second' "$GITHUB_WORKSPACE/postfix.log"
      - name: Run pre-fix WebKit proof
        working-directory: pre
        env:
          OPENCLAW_UI_WEBKIT: "1"
          PR182627_PROOF_VARIANT: pre-fix
        run: |
          set -o pipefail
          pnpm --dir ui exec vitest run --config vitest.config.ts --project=webkit \
            --maxWorkers=1 src/app/native-conversation-running-ui.browser.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/prefix.log"
          grep -q 'VERDICT:pre-fix:KILLED:navigate-timeout' "$GITHUB_WORKSPACE/prefix.log"
          grep -q 'wall jump Date.now delta=60000ms' "$GITHUB_WORKSPACE/prefix.log"
      - name: Run exact native WKWebView handler XCTest
        working-directory: post
        env:
          SWIFT_TEST_PACKAGE: apps/macos
        run: |
          test "$(git rev-parse HEAD)" = "$PR182627_NATIVE_HEAD"
          swift --version
          xcodebuild -version
          node scripts/prepare-apple-mermaid.mjs
          set -o pipefail
          swift test --package-path "$SWIFT_TEST_PACKAGE" --filter NativeConversationBridgeTests \
            2>&1 | tee "$GITHUB_WORKSPACE/native-xctest.log"
          grep -q 'NativeConversationBridgeTests' "$GITHUB_WORKSPACE/native-xctest.log"
      - name: Verify proof trees and capture logs
        if: always()
        run: |
          {
            echo "PR_HEAD=$(git -C post rev-parse HEAD)"
            echo "PR_PARENT=$(git -C pre rev-parse HEAD^)"
            echo "HARNESS_HEAD=$(git -C harness rev-parse HEAD)"
            echo "RUNNER_OS=$RUNNER_OS RUNNER_IMAGE=$ImageOS RUNNER_ARCH=$RUNNER_ARCH"
            echo "POST_GREP:"
            grep -E '\[proof\]|VERDICT|Tests ' postfix.log || true
            echo "PRE_GREP:"
            grep -E '\[proof\]|VERDICT|Tests ' prefix.log || true
            echo "NATIVE_GREP:"
            grep -E 'NativeConversationBridgeTests|Executed [0-9]+ test' native-xctest.log || true
            echo "PROOF_TREE_DIFF:"
            cat proof-harness.diff
          } | tee "$GITHUB_WORKSPACE/proof-summary.log"
          diff -q post/ui/src/app/native-conversation-running-ui.browser.test.ts \
            pre/ui/src/app/native-conversation-running-ui.browser.test.ts
          diff -q post/ui/vitest.config.ts pre/ui/vitest.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-conversation-running-ui-logs
          path: |
            environment.log
            harness.sha256
            postfix.log
            prefix.log
            native-xctest.log
            proof-summary.log
            bridge.diff
            proof-harness.diff
            tree.diff
