name: Native conversation running UI proof (PR #182627)

on:
  workflow_call:
    inputs:
      head:
        required: true
        type: string
      harness:
        required: true
        type: string
      native_repository:
        required: true
        type: string
      native_ref:
        required: true
        type: string

jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CI: "true"
      PR182627_HEAD: ${{ inputs.head }}
      PR182627_HARNESS: ${{ inputs.harness }}
      PR182627_NATIVE_REPOSITORY: ${{ inputs.native_repository }}
      PR182627_NATIVE_REF: ${{ inputs.native_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ env.PR182627_HEAD }}
          path: post
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ env.PR182627_HEAD }}
          path: pre
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout proof harness
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: ${{ env.PR182627_HARNESS }}
          path: harness
          persist-credentials: false
      - name: Checkout exact PR head for native XCTest
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PR182627_NATIVE_REPOSITORY }}
          ref: ${{ env.PR182627_NATIVE_REF }}
          path: native
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install post-fix checkout
        working-directory: post
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir ui exec playwright install webkit
      - name: Prepare exact pre-fix checkout
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git -C post rev-parse HEAD)" = "$PR182627_HEAD"
          test "$(git -C pre rev-parse HEAD)" = "$PR182627_HEAD"
          harness_head=$(git -C harness rev-parse HEAD)
          harness_input_head=$(git -C harness rev-parse "$PR182627_HARNESS^{commit}")
          echo "harness head=$harness_head input=$PR182627_HARNESS input_head=$harness_input_head"
          test "$harness_head" = "$harness_input_head"
          file=ui/src/app/native-conversation-bridge.ts
          test_file=ui/src/e2e/native-conversation-running-ui.e2e.test.ts
          for path in "$file" ui/src/test-helpers/control-ui-e2e.ts \
            ui/src/app/native-conversation-bridge.test.ts; do
            for checkout in post pre; do
              if ! test -f "$checkout/$path"; then
                echo "Missing proof file: $checkout/$path" >&2
                exit 1
              fi
            done
          done
          for checkout in post pre; do
            if ! test -d "$checkout/apps/macos/Tests/OpenClawIPCTests"; then
              echo "Missing proof directory: $checkout/apps/macos/Tests/OpenClawIPCTests" >&2
              exit 1
            fi
          done
          echo 'proof paths ready'
          git -C post show "$PR182627_HEAD^:$file" > pre/"$file"
          echo 'pre-file ready'
          grep -q 'deadline = performance.now()' post/$file
          echo 'post deadline ready'
          grep -q 'deadline = Date.now()' pre/$file
          echo 'pre deadline ready'
          diff -u post/$file pre/$file > "$GITHUB_WORKSPACE/bridge.diff" || true
          echo 'bridge diff ready'
          cp harness/.github/workflows/native-conversation-running-ui.browser.test.ts \
            "post/$test_file"
          test -f "post/$test_file"
          echo 'post test ready'
          cp harness/.github/workflows/native-conversation-running-ui.browser.test.ts \
            "pre/$test_file"
          test -f "pre/$test_file"
          echo 'pre test ready'
          git -C post status --short -- "$file" "$test_file" \
            > "$GITHUB_WORKSPACE/post.status"
          git -C pre status --short -- "$file" "$test_file" \
            > "$GITHUB_WORKSPACE/pre.status"
          echo 'status ready'
          status_ok=1
          if test -n "$(git -C post status --short -- "$file")"; then
            echo "Unexpected post-fix bridge change: post/$file"
            status_ok=0
          fi
          if test "$(git -C pre status --short -- "$file")" != " M $file"; then
            echo "Expected parent bridge change: pre/$file"
            status_ok=0
          fi
          if test "$(git -C pre diff --numstat -- "$file" | wc -l)" -ne 1; then
            echo "Unexpected parent bridge changes: pre/$file"
            status_ok=0
          fi
          for checkout in post pre; do
            if ! git -C "$checkout" status --short -- "$test_file" |
              grep -qx '?? '"$test_file"; then
              echo "Expected proof fixture missing: $checkout/$test_file"
              status_ok=0
            fi
          done
          if test "$status_ok" -ne 1; then
            echo "Proof checkouts do not match the intended patch."
            cat "$GITHUB_WORKSPACE/post.status"
            cat "$GITHUB_WORKSPACE/pre.status"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/bridge.diff" "$GITHUB_WORKSPACE/tree.diff"
          : > "$GITHUB_WORKSPACE/proof-harness.diff"
          comparison_ok=1
          for path in "$test_file"; do
            set +e
            diff -u "post/$path" "pre/$path" >> "$GITHUB_WORKSPACE/proof-harness.diff"
            comparison_status=$?
            set -e
            echo "proof comparison $path: exit=$comparison_status"
            if test "$comparison_status" -ne 0; then
              comparison_ok=0
            fi
          done
          if test "$comparison_ok" -ne 1; then
            echo "Proof harness checkouts differ from each other:"
            cat "$GITHUB_WORKSPACE/proof-harness.diff"
            exit 1
          fi
          shasum "post/$test_file" harness/.github/workflows/native-conversation-running-ui.browser.test.ts \
            > "$GITHUB_WORKSPACE/harness.sha256"
          cat "$GITHUB_WORKSPACE/bridge.diff"
          cat "$GITHUB_WORKSPACE/tree.diff"
      - name: Install pre-fix dependencies
        working-directory: pre
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir ui exec playwright install webkit
      - name: Install native XCTest checkout
        working-directory: native
        run: |
          test "$(git rev-parse HEAD)" = "$PR182627_NATIVE_REF"
          test "$(git rev-parse HEAD^{tree})" = "$(git -C ../post rev-parse HEAD^{tree})"
          corepack enable
          pnpm install --frozen-lockfile --optional \
            --filter '@openclaw/mermaid-renderer...' \
            --filter '@openclaw/gateway-protocol...'
          node scripts/prepare-apple-mermaid.mjs
      - name: Production Control UI and WebKit environment
        working-directory: post
        run: |
          {
            echo "PR_HEAD=$(git rev-parse HEAD)"
            echo "PR_PARENT=$(git rev-parse HEAD^)"
            echo "HARNESS_HEAD=$(git -C ../harness rev-parse HEAD)"
            echo "RUNNER_OS=$RUNNER_OS RUNNER_IMAGE=$ImageOS RUNNER_ARCH=$RUNNER_ARCH"
            echo "NODE=$(node --version)"
            echo "PNPM=$(pnpm --version)"
            echo "PLAYWRIGHT=$(pnpm --dir ui exec playwright --version)"
          } | tee "$GITHUB_WORKSPACE/environment.log"
      - name: Run post-fix WebKit proof
        working-directory: post
        env:
          PR182627_PROOF_VARIANT: post-fix
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --maxWorkers=1 \
            ui/src/e2e/native-conversation-running-ui.e2e.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/postfix.log"
          grep -q 'VERDICT:post-fix:SUCCEEDED:none' "$GITHUB_WORKSPACE/postfix.log"
      - name: Run pre-fix WebKit proof
        working-directory: pre
        env:
          PR182627_PROOF_VARIANT: pre-fix
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --maxWorkers=1 \
            ui/src/e2e/native-conversation-running-ui.e2e.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/prefix.log"
          grep -q 'VERDICT:pre-fix:KILLED:navigate-timeout' "$GITHUB_WORKSPACE/prefix.log"
          grep -q 'wall jump Date.now delta=60000ms' "$GITHUB_WORKSPACE/prefix.log"
      - name: Run exact native WKWebView handler XCTest
        working-directory: native
        env:
          SWIFT_TEST_PACKAGE: apps/macos
        run: |
          test "$(git rev-parse HEAD)" = "$PR182627_NATIVE_REF"
          swift --version
          xcodebuild -version
          set -o pipefail
          swift test --package-path "$SWIFT_TEST_PACKAGE" --filter NativeConversationBridgeTests \
            2>&1 | tee "$GITHUB_WORKSPACE/native-xctest.log"
          grep -q 'NativeConversationBridgeTests.*passed' "$GITHUB_WORKSPACE/native-xctest.log"
          grep -q 'Test run with 5 tests in 1 suite passed' "$GITHUB_WORKSPACE/native-xctest.log"
          test "$(git rev-parse HEAD)" = "$PR182627_NATIVE_REF"
          git update-index --refresh
          test -z "$(git ls-files -- apps/shared/OpenClawKit/Sources/OpenClawChatUI/Resources/Mermaid)"
          if git -C apps/shared/OpenClawKit/Sources/OpenClawChatUI/Resources/Mermaid \
            rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "Generated Mermaid assets unexpectedly entered a Git worktree." >&2
            exit 1
          fi
      - name: Verify proof trees and capture logs
        if: always()
        run: |
          {
            echo "PR_HEAD=$(git -C post rev-parse HEAD)"
            echo "PR_PARENT=$(git -C pre rev-parse HEAD^)"
            echo "HARNESS_HEAD=$(git -C harness rev-parse HEAD)"
            echo "NATIVE_HEAD=$(git -C native rev-parse HEAD)"
            echo "RUNNER_OS=$RUNNER_OS RUNNER_IMAGE=$ImageOS RUNNER_ARCH=$RUNNER_ARCH"
            echo "POST_GREP:"
            grep -E '\[proof\]|VERDICT|Tests ' postfix.log || true
            echo "PRE_GREP:"
            grep -E '\[proof\]|VERDICT|Tests ' prefix.log || true
            echo "NATIVE_GREP:"
            grep -E 'NativeConversationBridgeTests|Executed [0-9]+ test' native-xctest.log || true
            echo "PROOF_TREE_DIFF:"
            cat proof-harness.diff
          } | tee "$GITHUB_WORKSPACE/proof-summary.log"
          diff -q post/ui/src/e2e/native-conversation-running-ui.e2e.test.ts \
            pre/ui/src/e2e/native-conversation-running-ui.e2e.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-conversation-running-ui-logs
          path: |
            environment.log
            harness.sha256
            postfix.log
            prefix.log
            native-xctest.log
            proof-summary.log
            bridge.diff
            proof-harness.diff
            tree.diff
