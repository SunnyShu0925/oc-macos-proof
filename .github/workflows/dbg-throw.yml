name: Debug why FIXED throws
on:
  workflow_dispatch:
jobs:
  dbg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: fix/launchd-runtime-bootstrap-teardown-deadline-wall-clock-181
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Instrument and run
        shell: bash
        run: |
          UID_NUM="$(id -u)"
          cat > /tmp/probe.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>ai.openclaw.probe</string>
            <key>ProgramArguments</key><array><string>/bin/sleep</string><string>1</string></array>
          </dict></plist>
          PLIST
          # Instrument the throw site with real classification values.
          python3 - <<'PY'
          p="src/daemon/launchd-runtime.ts"
          s=open(p).read()
          needle="    const remainingMs = teardownDeadline - performance.now();"
          assert needle in s, "needle not found"
          inject='''    const remainingMs = teardownDeadline - performance.now();
    console.error("[DBG] remainingMs=" + remainingMs + " retryPending=" + params.retryPendingTeardown +
      " pendingTeardown=" + isLaunchctlBootstrapPendingTeardown(boot) +
      " term=" + boot.termination + " code=" + boot.code +
      " stderr=" + JSON.stringify(boot.stderr));'''
          s=s.replace(needle, inject)
          open(p,"w").write(s)
          print("instrumented")
PY
          cat > ./dbg.ts <<'SCRIPT'
          const UID = process.env.UID_NUM!;
          const { bootstrapLaunchAgentOrThrow } = await import("./src/daemon/launchd-runtime.ts");
          try {
            await bootstrapLaunchAgentOrThrow({
              domain: "user/" + UID,
              serviceTarget: "user/" + UID + "/ai.openclaw.probe",
              plistPath: "/tmp/probe.plist",
              actionHint: "dbg",
              retryPendingTeardown: true,
            });
            console.log("RESULT resolved");
          } catch (e:any) { console.log("RESULT threw:", e.message); }
          SCRIPT
          UID_NUM=$UID_NUM node --import tsx/esm ./dbg.ts 2>&1 | grep -E "\[DBG\]|RESULT" | head -12
