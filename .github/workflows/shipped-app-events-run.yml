name: Shipped app Agent Events run (PR 188827)

# Full proof: build dist/OpenClaw.app from the PR branch, run a local Gateway,
# drive two real agent turns, open Debug -> Open Agent Events through the status
# menu with System Events, and capture the real window.

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR branch on SunnyShu0925/openclaw
        required: true
        default: fix/agent-events-window-id-187608
      mode:
        description: "head (fixed) or base (id: .seq reverted)"
        required: true
        default: head

jobs:
  proof:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          node --version || true

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: openclaw
        timeout-minutes: 25
        run: pnpm install --frozen-lockfile

      - name: Prepare apple mermaid assets
        working-directory: openclaw
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Apply mode
        working-directory: openclaw
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          SRC=apps/macos/Sources/OpenClaw/AgentEventsWindow.swift
          if [ "$MODE" = "base" ]; then
            python3 - "$SRC" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if "id: \\.id" not in s:
              raise SystemExit("expected id: \\.id in " + str(p))
          p.write_text(s.replace("id: \\.id", "id: \\.seq"))
          print("BASE mode: reverted to id: \\.seq")
          PY
          fi
          grep -n "ForEach" "$SRC" | head -3

      - name: Build plugin assets
        working-directory: openclaw
        timeout-minutes: 20
        run: pnpm plugins:assets:build

      - name: Package app (ad-hoc)
        working-directory: openclaw
        timeout-minutes: 70
        env:
          ALLOW_ADHOC_SIGNING: "1"
          SIGN_IDENTITY: "-"
          OPENCLAW_PACKAGE_APP_ROOT: ${{ github.workspace }}/openclaw/dist/OpenClaw.app
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          touch "$HOME/.openclaw/disable-launchagent"
          ./scripts/package-mac-app.sh 2>&1 | tail -80
          ls -la dist/OpenClaw.app/Contents/MacOS/

      - name: Write config + stub model + start Gateway
        working-directory: openclaw
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openclaw"
          cat > "$HOME/.openclaw/openclaw.json" <<'JSON'
          {
            "gateway": { "mode": "local", "port": 18789, "auth": { "mode": "none" } },
            "models": {
              "providers": {
                "stub": {
                  "baseUrl": "http://127.0.0.1:18999/v1",
                  "api": "openai-completions",
                  "apiKey": "stub-key",
                  "models": [
                    {
                      "id": "stub-1",
                      "name": "Stub 1",
                      "compat": {
                        "supportsTools": false,
                        "requiresStringContent": true,
                        "strictMessageKeys": true
                      }
                    }
                  ]
                }
              }
            },
            "agents": { "defaults": { "model": "stub/stub-1" } }
          }
          JSON
          cat > /tmp/stub-model.mjs <<'JS'
          import http from "node:http";
          const port = Number(process.env.STUB_PORT || 18999);
          const server = http.createServer((req, res) => {
            let body = "";
            req.on("data", (c) => { body += c; });
            req.on("end", () => {
              if (req.url.startsWith("/v1/models")) {
                res.writeHead(200, { "content-type": "application/json" });
                res.end(JSON.stringify({ object: "list", data: [{ id: "stub-1", object: "model" }] }));
                return;
              }
              if (!req.url.includes("/chat/completions")) {
                res.writeHead(404); res.end("not found"); return;
              }
              let parsed = {};
              try { parsed = JSON.parse(body || "{}"); } catch {}
              const id = "chatcmpl-stub-" + Date.now();
              const created = Math.floor(Date.now() / 1000);
              const model = parsed.model || "stub-1";
              if (parsed.stream === false) {
                res.writeHead(200, { "content-type": "application/json" });
                res.end(JSON.stringify({
                  id, object: "chat.completion", created, model,
                  choices: [{ index: 0, message: { role: "assistant", content: "stub reply" }, finish_reason: "stop" }],
                  usage: { prompt_tokens: 1, completion_tokens: 2, total_tokens: 3 }
                }));
                return;
              }
              res.writeHead(200, {
                "content-type": "text/event-stream",
                "cache-control": "no-cache",
                connection: "keep-alive"
              });
              const chunk = (delta, finish = null) => "data: " + JSON.stringify({
                id, object: "chat.completion.chunk", created, model,
                choices: [{ index: 0, delta, finish_reason: finish }]
              }) + "\n\n";
              res.write(chunk({ role: "assistant", content: "" }));
              res.write(chunk({ content: "stub reply" }));
              res.write(chunk({}, "stop"));
              res.write("data: [DONE]\n\n");
              res.end();
            });
          });
          server.listen(port, "127.0.0.1", () => console.log("stub model listening on " + port));
          JS
          nohup node /tmp/stub-model.mjs > /tmp/stub.log 2>&1 &
          nohup node openclaw.mjs gateway run > /tmp/gateway.log 2>&1 &
          sleep 45
          echo "--- stub ---"; tail -5 /tmp/stub.log || true
          echo "--- gateway ---"; tail -30 /tmp/gateway.log || true
          node openclaw.mjs gateway status || true
          node openclaw.mjs models list 2>&1 | head -20 || true

      - name: Launch app
        working-directory: openclaw
        run: |
          set -euo pipefail
          ./dist/OpenClaw.app/Contents/MacOS/OpenClaw --attach-only --no-activate --background-only \
            > /tmp/app.log 2>&1 &
          sleep 30
          pgrep -fl "OpenClaw.app/Contents/MacOS/OpenClaw" || echo "APP_NOT_RUNNING"
          tail -40 /tmp/app.log || true

      - name: Agent turn A (before the window opens)
        working-directory: openclaw
        continue-on-error: true
        run: |
          node openclaw.mjs agent --session-id events-a --message "Reply with the single word: alpha" --json \
            > /tmp/turn-a.json 2>/tmp/turn-a.err || true
          head -40 /tmp/turn-a.json || true
          tail -20 /tmp/turn-a.err || true

      - name: Open Agent Events window
        continue-on-error: true
        run: |
          osascript <<'AS' 2>&1 || true
          tell application "System Events"
            tell process "OpenClaw"
              get name of every menu bar
            end tell
          end tell
          AS
          osascript <<'AS' 2>&1 || true
          tell application "System Events"
            tell process "OpenClaw"
              click menu bar item 1 of menu bar 2
              delay 1
              click menu item "Debug" of menu 1 of menu bar item 1 of menu bar 2
              delay 1
              click (first menu item of menu 1 of menu item "Debug" of menu 1 of menu bar item 1 of menu bar 2 whose name starts with "Open Agent Events")
            end tell
          end tell
          AS
          sleep 3

      - name: Agent turn B (window already open, same seq numbers)
        working-directory: openclaw
        continue-on-error: true
        run: |
          node openclaw.mjs agent --session-id events-b --message "Reply with the single word: beta" --json \
            > /tmp/turn-b.json 2>/tmp/turn-b.err || true
          head -40 /tmp/turn-b.json || true
          tail -20 /tmp/turn-b.err || true
          sleep 4

      - name: Capture window + rows
        run: |
          set -euo pipefail
          cat > /tmp/windowid.swift <<'SWIFT'
          import CoreGraphics
          let list = CGWindowListCopyWindowInfo([.optionAll, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in list {
            let owner = w[kCGWindowOwnerName as String] as? String ?? ""
            if owner.contains("OpenClaw") {
              print("WINDOW owner=\(owner) name=\(w[kCGWindowName as String] ?? "") id=\(w[kCGWindowNumber as String] ?? -1)")
            }
          }
          SWIFT
          swift /tmp/windowid.swift 2>&1 | tee /tmp/windows.txt
          WID=$(grep "name=Agent Events" /tmp/windows.txt | sed -n 's/.* id=\([0-9-]*\).*/\1/p' | head -1)
          echo "WID=$WID"
          if [ -n "$WID" ]; then screencapture -x -o -l "$WID" /tmp/agent-events-window.png || true; fi
          file /tmp/agent-events-window.png || true
          osascript <<'AS' 2>&1 | tee /tmp/rows.txt || true
          tell application "System Events"
            tell process "OpenClaw"
              if exists window "Agent Events" then
                set out to ""
                repeat with e in (entire contents of window "Agent Events")
                  try
                    if role of e is "AXStaticText" then set out to out & (value of e as text) & linefeed
                  end try
                end repeat
                return out
              else
                return "NO_WINDOW"
              end if
            end tell
          end tell
          AS
          echo "--- rows ---"; cat /tmp/rows.txt || true

      - name: Collect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-app-events-run-${{ inputs.mode }}
          path: |
            /tmp/agent-events-window.png
            /tmp/rows.txt
            /tmp/windows.txt
            /tmp/app.log
            /tmp/gateway.log
            /tmp/stub.log
            /tmp/turn-a.json
            /tmp/turn-a.err
            /tmp/turn-b.json
            /tmp/turn-b.err
