name: macOS Probe 3 (user-domain EIO + BSD clock)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-14
    shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Probe user-domain EIO + clock
        run: |
          set +e
          UID_NUM=$(id -u)
          echo "UID=$UID_NUM"
          cat > /tmp/probe.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>ai.openclaw.probe</string>
            <key>ProgramArguments</key><array><string>/bin/sleep</string><string>1</string></array>
          </dict></plist>
          PLIST
          echo "=== user domain EIO stability (3x) ==="
          for i in 1 2 3; do launchctl bootstrap "user/$UID_NUM" /tmp/probe.plist 2>&1; echo "  attempt $i exit=$?"; done
          echo "=== gui domain EIO for a missing plist? ==="
          launchctl bootstrap "gui/$UID_NUM" /tmp/nonexistent.plist 2>&1; echo "  missing exit=$?"
          echo "=== clock: sudo date relative -v (need networktime off) ==="
          sudo -n systemsetup -setusingnetworktime off 2>&1 | tail -1
          echo "before: $(date)"
          sudo -n date -v+300S 2>&1; echo "  date-forward exit=$?"
          echo "after forward: $(date)"
          sudo -n date -v-300S 2>&1; echo "  date-back exit=$?"
          echo "after back: $(date)"
          sudo -n systemsetup -setusingnetworktime on 2>&1 | tail -1
          echo "DONE"
