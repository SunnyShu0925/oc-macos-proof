name: Shipped Launchd Stop Contrast (PR 183033)

# Real `openclaw daemon stop --force` on macos-14 against a real LaunchAgent that
# runs the real Gateway. A sibling process occupies the Gateway TCP port the
# moment the job releases it, so the shipped port-release wait runs against a
# real busy port. A real forward wall-clock jump is injected into the shipped
# CLI process; the pre-fix binary reverts only the six stop clock reads.

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: "PR branch on SunnyShu0925/openclaw"
        required: false
        default: "fix/launchd-stop-deadline-monotonic-180"
      jump_ms:
        description: "Forward wall-clock jump size (ms)"
        required: false
        default: "400000"
      jump_at_ms:
        description: "When the wall-clock jump lands (ms after CLI start)"
        required: false
        default: "30000"

jobs:
  macos-proof:
    runs-on: macos-14
    defaults:
      run:
        working-directory: openclaw
    steps:
      - name: Checkout openclaw PR branch
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw
          fetch-depth: 1

      - name: Checkout oc-macos-proof (probe scripts)
        uses: actions/checkout@v4
        with:
          path: oc-macos-proof
          fetch-depth: 1

      - name: Copy probe scripts into openclaw tree
        run: |
          mkdir -p proofs/183033
          cp ../oc-macos-proof/proofs/183033/* proofs/183033/
          ls -l proofs/183033

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        timeout-minutes: 20
        run: pnpm install --frozen-lockfile

      - name: Build CLI (post-fix)
        timeout-minutes: 20
        run: pnpm build cliStartup
        continue-on-error: true

      - name: Verify CLI
        run: |
          node --version
          sw_vers
          node openclaw.mjs --version

      - name: Probe shipped stop (post-fix, performance.now)
        timeout-minutes: 45
        continue-on-error: true
        env:
          PROOF_JUMP_MS: ${{ github.event.inputs.jump_ms }}
          PROOF_JUMP_AT_MS: ${{ github.event.inputs.jump_at_ms }}
        run: |
          bash proofs/183033/probe-launchd-stop.sh fixed "$(pwd)"
          exit 0

      - name: Rebuild pre-fix (Date.now) from a clean dist
        if: always()
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SRC="src/daemon/launchd-stop.ts"
          cp "$SRC" "$SRC.postfix.bak"
          perl -pi -e 's/performance\.now\(\)/Date.now()/g' "$SRC"
          echo "source deadline lines:"
          grep -n "deadline = " "$SRC"
          rm -rf dist
          pnpm build cliStartup
          echo "--- verify built artifacts use Date.now ---"
          CHUNK=$(grep -rl "waitForGatewayPortRelease" dist | head -1)
          echo "chunk=$CHUNK"
          LINES=$(grep -nE "deadline = (Date|performance)\.now\(\)|(Date|performance)\.now\(\) (>=|<) deadline" "$CHUNK" || true)
          echo "$LINES"
          DATE_HITS=$(echo "$LINES" | grep -c "Date\.now()" || true)
          PERF_HITS=$(echo "$LINES" | grep -c "performance\.now()" || true)
          echo "VERIFY dateHits=$DATE_HITS performanceHits=$PERF_HITS"
          cp "$SRC.postfix.bak" "$SRC"
          rm -f "$SRC.postfix.bak"
          test "$DATE_HITS" -ge 4
          test "$PERF_HITS" -eq 0

      - name: Probe shipped stop (pre-fix, Date.now)
        if: always()
        timeout-minutes: 45
        continue-on-error: true
        env:
          PROOF_JUMP_MS: ${{ github.event.inputs.jump_ms }}
          PROOF_JUMP_AT_MS: ${{ github.event.inputs.jump_at_ms }}
          SKIP_BASELINE: "1"
        run: |
          bash proofs/183033/probe-launchd-stop.sh prefix "$(pwd)"
          exit 0

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchd-stop-contrast-183033
          path: openclaw/proof-run
          retention-days: 30
          if-no-files-found: warn
