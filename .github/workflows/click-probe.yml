name: click-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and launch click probe
        run: |
          set -euo pipefail
          APP=/tmp/ClickProbe.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          cp probe/click-app/Info.plist "$APP/Contents/Info.plist"
          swiftc -O probe/click-app/main.swift -o "$APP/Contents/MacOS/MenuProbe"
          rm -f /tmp/click.log
          open "$APP"
          sleep 3
          pgrep -fl MenuProbe || true
          cat /tmp/click.log || true

      - name: Try left, control-left, right click
        run: |
          set +e
          P="$PWD/probe"
          swift "$P/menu-windows.swift" MenuProbe 0 | tee /tmp/win.txt
          read -r X Y < <(python3 "$P/status-point.py" /tmp/win.txt) || true
          echo "CLICK_POINT=$X,$Y"
          if [ -z "${X:-}" ] || [ -z "${Y:-}" ]; then echo "NO_COORDS"; exit 0; fi

          echo "=== A: plain left click"
          osascript -e "tell application \"System Events\" to click at {$X, $Y}" 2>&1
          sleep 2
          tail -6 /tmp/click.log || true
          swift "$P/menu-windows.swift" MenuProbe || true
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1

          echo "=== B: control + left click"
          osascript -e 'tell application "System Events" to key down control' 2>&1
          osascript -e "tell application \"System Events\" to click at {$X, $Y}" 2>&1
          osascript -e 'tell application "System Events" to key up control' 2>&1
          sleep 2
          tail -6 /tmp/click.log || true
          swift "$P/menu-windows.swift" MenuProbe || true
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1

          echo "=== C: CGEvent right click"
          swift "$P/right-click.swift" "$X" "$Y" || true
          sleep 2
          tail -6 /tmp/click.log || true
          swift "$P/menu-windows.swift" MenuProbe || true
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1

          echo "=== final log"
          cat /tmp/click.log || true
