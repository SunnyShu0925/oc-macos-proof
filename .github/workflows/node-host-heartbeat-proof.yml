name: Node-Host Heartbeat Monotonic Shipped-Worker Proof (PR #182481)

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: PR branch on SunnyShu0925/openclaw to test
        required: true
        default: fix/node-invoke-progress-heartbeat-monotonic
      interval_ms:
        description: heartbeat interval under test (idle/2)
        required: false
        default: '250'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout openclaw PR branch (fork)
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ github.event.inputs.pr_branch }}
          path: openclaw

      - name: Checkout proof scripts
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/oc-macos-proof
          ref: main
          path: proofrepo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install deps (pnpm)
        working-directory: openclaw
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare isolated state dir with a valid config
        run: |
          mkdir -p "$RUNNER_TEMP/oc-state"
          cp "$GITHUB_WORKSPACE/openclaw/test/fixtures/state-corpus/2026.9.2/state/openclaw.json" "$RUNNER_TEMP/oc-state/openclaw.json"

      - name: Run shipped-worker proof OLD (Date.now heartbeat, 2s rewind)
        working-directory: openclaw
        run: |
          git -C "$GITHUB_WORKSPACE/openclaw" checkout -- src/node-host/node-invoke-progress.ts extensions/file-transfer/index.ts src/infra/node-commands.ts
          OPENCLAW_DIR=$GITHUB_WORKSPACE/openclaw PROOF_VARIANT=OLD node $GITHUB_WORKSPACE/proofrepo/prepare-proof.mjs
          node --import tsx $GITHUB_WORKSPACE/proofrepo/parent-driver.mts
        env:
          PROOF_VARIANT: OLD
          WORKER_ENTRY: ${{ github.workspace }}/proofrepo/worker-entry.mts
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw
          PROOF_INTERVAL_MS: ${{ github.event.inputs.interval_ms }}
          PROOF_OBSERVE_MS: '10000'
          PROOF_ARM_MS: '3000'
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/oc-state

      - name: Run shipped-worker proof FIXED (performance.now heartbeat, 2s rewind)
        working-directory: openclaw
        run: |
          git -C "$GITHUB_WORKSPACE/openclaw" checkout -- src/node-host/node-invoke-progress.ts extensions/file-transfer/index.ts src/infra/node-commands.ts
          OPENCLAW_DIR=$GITHUB_WORKSPACE/openclaw PROOF_VARIANT=FIXED node $GITHUB_WORKSPACE/proofrepo/prepare-proof.mjs
          node --import tsx $GITHUB_WORKSPACE/proofrepo/parent-driver.mts
        env:
          PROOF_VARIANT: FIXED
          WORKER_ENTRY: ${{ github.workspace }}/proofrepo/worker-entry.mts
          OPENCLAW_DIR: ${{ github.workspace }}/openclaw
          PROOF_INTERVAL_MS: ${{ github.event.inputs.interval_ms }}
          PROOF_OBSERVE_MS: '10000'
          PROOF_ARM_MS: '3000'
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/oc-state

      - name: Collect verdict
        if: always()
        run: echo "See step logs for RESULT[] lines (OLD vs FIXED)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-host-heartbeat-proof-logs
          path: |
            /tmp/proof-loader.log
